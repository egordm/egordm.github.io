<title id="title">positions</title>
<desc id="desc">The context and question form a wrapped sequence of schematic token boxes. QRHead measures attention from the question tokens to the fact. The sequence ends in an empty answer slot, filled with 30. Wu and LOCOS measure at the step that predicts this answer token. Token boundaries are illustrative.</desc>
