<svg xmlns="http://www.w3.org/2000/svg" width="420" height="364" viewBox="0 0 420 364" role="img" aria-labelledby="title desc">
<title id="title">Usable context and default compaction</title>
<desc id="desc">Linear scales. The full one-million-token capacity is measured only through 512K. The lower scale expands the 272K Codex window: usable context reaches 64K with reasoning off and about 128K with reasoning high. Default compaction is about 258K, past both. Usable means retaining at least 85% of the short-context score.</desc>
