<svg xmlns="http://www.w3.org/2000/svg" width="420" height="402" viewBox="0 0 420 402" role="img" aria-labelledby="title desc">
<title id="title">locos contrast</title>
<desc id="desc">Sum the pushes from fact tokens. Subtract the sum from the rest of the context, rescaled to the fact length. Here the background is near zero, leaving A 0.07, B 0.90 and C 0.01. The question stays fixed.</desc>
<rect x="0" y="0" width="420" height="402" rx="0" fill="#1e1e1e"/>
<text x="105" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#a6b8ff">Fact</text>
<rect x="16" y="40" width="178" height="70" rx="7" fill="#30374f" stroke="#4c504d"/>
<text x="105" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#a6b8ff">The timeout is</text>
<text x="105" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#a6b8ff">half a minute.</text>
<path d="M105 117 L105 144" fill="none" stroke="#a6b8ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M102.12344676837478 138.73450462865776 L105 144 L107.87655323162522 138.73450462865776" fill="none" stroke="#a6b8ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<rect x="16" y="154" width="178" height="94" rx="7" fill="#292b2a" stroke="#4c504d"/>
<text x="315" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#bdbdb8">Rest of context</text>
<rect x="226" y="40" width="178" height="70" rx="7" fill="#292b2a" stroke="#4c504d"/>
<text x="315" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#bdbdb8">Logs rotate daily.</text>
<text x="315" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#bdbdb8">Retries use backoff.</text>
<path d="M315 117 L315 144" fill="none" stroke="#bdbdb8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M312.1234467683748 138.73450462865776 L315 144 L317.8765532316252 138.73450462865776" fill="none" stroke="#bdbdb8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<rect x="226" y="154" width="178" height="94" rx="7" fill="#292b2a" stroke="#4c504d"/>
<text x="105" y="191" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#a6b8ff">∑<tspan baseline-shift="sub" font-size="65%"><tspan font-style="italic">j</tspan>∈F</tspan> <tspan font-style="italic">φ</tspan><tspan baseline-shift="sub" font-size="70%">j</tspan></text>
<text x="105" y="227" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#bdbdb8">push from fact tokens</text>
<text x="270" y="179" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#efefeb">|F|</text>
<path d="M256 185 L284 185" fill="none" stroke="#efefeb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="270" y="205" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#efefeb">|R|</text>
<text x="339" y="194" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#efefeb">∑<tspan baseline-shift="sub" font-size="65%"><tspan font-style="italic">j</tspan>∈R</tspan> <tspan font-style="italic">φ</tspan><tspan baseline-shift="sub" font-size="70%">j</tspan></text>
<text x="315" y="227" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#bdbdb8">rescaled background</text>
<text x="210" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#efefeb">−</text>
<path d="M105 256 L105 269" fill="none" stroke="#bdbdb8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M315 256 L315 269" fill="none" stroke="#bdbdb8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M105 269 L315 269" fill="none" stroke="#bdbdb8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M210 269 L210 292" fill="none" stroke="#bdbdb8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M207.12344676837478 286.73450462865776 L210 292 L212.87655323162522 286.73450462865776" fill="none" stroke="#bdbdb8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="210" y="313" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#bdbdb8">LOCOS · background near zero here</text>
<rect x="24" y="330" width="108" height="46" rx="7" fill="#292b2a" stroke="#4c504d"/>
<text x="78" y="359" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#7bd7c8">A  0.07</text>
<rect x="156" y="330" width="108" height="46" rx="7" fill="#30374f" stroke="#a6b8ff"/>
<text x="210" y="359" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#a6b8ff">B  0.90</text>
<rect x="288" y="330" width="108" height="46" rx="7" fill="#292b2a" stroke="#4c504d"/>
<text x="342" y="359" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#ffa96e">C  0.01</text>
<text x="210" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#bdbdb8">Sum of token pushes · question held fixed</text>
</svg>
