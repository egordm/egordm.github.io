<title id="title">Repeated keys bring all three branches out of the plateau before control.</title>
<desc id="desc">Accuracy after branching from one plateau checkpoint with six fresh data orders: three control branches take off at 9,000 to 17,500 updates, while three repeated-key branches take off at 750 to 2,500. Dots mark takeoff; all recorded observations are connected through each branch&#x27;s end. The dashed line marks the copy level of 0.1003.</desc>
