<title id="title">Perfect to 8K, then a slide.</title>
<desc id="desc">Share of needles the model found, by document length, averaged over five positions: 100% at 1K, 4K and 8K, 90% at 16K, 76% at 24K, with 95% intervals. It crosses the 85% bar between 16K and 24K, inside the advertised 32K window. The keyword version, tested at 1K and at 24K, found 14 of 14 at both.</desc>
