<title id="title">One fact, two ways to plant it.</title>
<desc id="desc">The question asks which character is a Shakespeare devotee. The original needle says Greta Simeon can recite Hamlet&#x27;s soliloquy; answering needs the hop Shakespeare to Hamlet to Greta Simeon. The keyword version says Shakespeare&#x27;s Hamlet, so the question&#x27;s own word sits next to the answer.</desc>
