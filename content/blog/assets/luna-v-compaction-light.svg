<text x="231" y="167" fill="#4557ba" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">≈128K</text>
<text x="231" y="187" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">useful ceiling</text>
