<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" role="img" aria-labelledby="title desc">
<title id="title">The copy half is ready while the graded match lags.</title>
<desc id="desc">Three AdamW 1e-4 seeds after the 20,000-update verbatim warm stage. Teal lines show restatement forced lead; dashed grey lines show stock lead. Only checkpoints with restatement accuracy below 0.45 are drawn, ending with dots at each seed&#x27;s last plateau checkpoint. The vertical axis starts at zero. The faint band marks 1 to 3 logits, where MQAR took off; graded forced leads can pass this range while stock stays flat.</desc>
