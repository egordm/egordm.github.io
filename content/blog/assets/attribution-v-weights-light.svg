<svg xmlns="http://www.w3.org/2000/svg" width="420" height="282" viewBox="0 0 420 282" role="img" aria-labelledby="title desc">
<title id="title">Signed source weights</title>
<desc id="desc">Signed log-odds weights: lsof +6.1 and config -0.75. Keeping lsof multiplies the odds of 3000 by about 440; config by about one half.</desc>
<defs><pattern id="untested" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" fill="none" stroke="#d8dcd7" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="420" height="282" rx="0" fill="#ffffff"/>
<text x="24" y="28" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Weights for “3000”</text>
<text x="24" y="60" fill="#00796b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">lsof result</text>
<text x="396" y="60" fill="#00796b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="end">+6.1</text>
<rect x="110" y="72" width="262.3" height="24" rx="2" fill="#00796b"/>
<text x="396" y="121" fill="#00796b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="end">odds × about 440</text>
<text x="24" y="158" fill="#a8460c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">config file</text>
<text x="396" y="158" fill="#a8460c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="end">−0.75</text>
<rect x="77.75" y="170" width="32.25" height="24" rx="2" fill="#a8460c"/>
<text x="396" y="219" fill="#a8460c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="end">odds × about one half</text>
<path d="M110 66L110 200" fill="none" stroke="#595e5b" stroke-width="1" stroke-linecap="round"/>
<text x="110" y="219" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle">0</text>
<text x="24" y="260" fill="#a8460c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">← opposes</text>
<text x="396" y="260" fill="#00796b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="end">supports →</text>
<text x="210" y="260" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">log-odds</text>
</svg>
