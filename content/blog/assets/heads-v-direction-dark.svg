<title id="title">direction</title>
<desc id="desc">Schematic writes from the half-a-minute fact at the answer position. Each panel aligns its horizontal axis with the token being scored, 30 or the mistaken 60. The projection measures support, not correctness. Arrow lengths are illustrative, not measured scores.</desc>
