<title id="title">verdict</title>
<desc id="desc">Over the same 12 filtered pairs: masking every derivation restatement leaves correctness at 0.83; a random-sentence mask leaves 1.00. Corrupting every derivation restatement is followed on 0.92; corrupting an unrelated placeholder is followed on 0.00. All bars run from zero to one. The written derivation is usually not needed, but trusted.</desc>
