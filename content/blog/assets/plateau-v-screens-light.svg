<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
<title id="title">Lever takeoffs beside their own control branches.</title>
<desc id="desc">Seventeen tests in source order. Each grey bar spans the fastest to slowest control takeoff for that test; an open end reaches the 27,500 update cap when control is censored. Three dots show each lever&#x27;s takeoffs, teal for the supplied pass verdict and warm for fail. Hollow dots with right chevrons mark branches that never took off before the cap. Nearby dots are separated vertically. Verdicts follow the source data.</desc>
