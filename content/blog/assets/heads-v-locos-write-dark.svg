<title id="title">locos write</title>
<desc id="desc">A source value becomes a full-strength write, then an attention-scaled write, then a projection onto the answer direction. The example plots use identical scales and summarize the fact tokens: A has a projection 0.07, B 0.90. Faint arrows are full strength, solid arrows are delivered.</desc>
