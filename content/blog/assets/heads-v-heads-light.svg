<title id="title">heads</title>
<desc id="desc">Invented roles inspired by real heads. A matches the question to the fact: close attention, small push toward 30. B moves content toward the output: less fact attention, strong push toward 30. C rests on the first token regardless of the question. Arrows illustrate behaviour, not a numeric scale.</desc>
