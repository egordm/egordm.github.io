<desc id="desc">Invented example. Fact one links Lira Venn to sketching Saturn. Fact two links Lira Venn to signing letters as Sorel Ash. Astronomy enthusiast identifies Lira; alias asks for Sorel. The question shares no words with the facts. The control stops after the first connection.</desc>
