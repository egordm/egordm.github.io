<svg xmlns="http://www.w3.org/2000/svg" width="420" height="244" viewBox="0 0 420 244" role="img" aria-labelledby="title desc">
<title id="title">Forcing attention onto the correct value reveals the copy path&#x27;s lead.</title>
<desc id="desc">Schematic, not measured data. Both rows contain A 3 B 7 C 1 A ?. Ordinary attention is spread across the seven earlier tokens and the output scores for 3, 7 and 1 are equal. Forced attention permits only the first 3; all other earlier positions are blocked. The score for 3 then exceeds the mean score for 7 and 1, marked by a dashed line. The bracket marks that difference, the answer&#x27;s lead.</desc>
