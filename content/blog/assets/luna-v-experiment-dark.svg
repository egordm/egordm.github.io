<svg xmlns="http://www.w3.org/2000/svg" width="420" height="670" viewBox="0 0 420 670" role="img" aria-labelledby="title desc">
<title id="title">Bury it. Move it. Ask.</title>
<desc id="desc">Experiment schematic. Grow book context from 250 to 512K tokens. In separate runs place one fact at 25, 50 or 75 percent depth. Ask a meaning question and its shared-word control separately, using 28 question types. Reasoning is off or high, with high on a subset. No answer uses tools. Removing the fact yields zero correct names out of 28.</desc>
