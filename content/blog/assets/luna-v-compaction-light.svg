<text x="40" y="187" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">useful ceiling</text>
<rect x="215" y="110" width="181" height="88" rx="12" fill="#e9edfc"/>
