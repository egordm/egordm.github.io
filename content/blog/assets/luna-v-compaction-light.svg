<svg xmlns="http://www.w3.org/2000/svg" width="420" height="656" viewBox="0 0 420 656" role="img" aria-labelledby="title desc">
<title id="title">Compact before the fall.</title>
<desc id="desc">Compaction guide for meaning-based work. The full linear bar runs from zero to the advertised one million tokens, with no measurements beyond 512K. A second linear bar zooms in on the default 272K window. The usable ceilings are 64K with reasoning off and about 128K with reasoning high; the latter varies from 64K to 192K by book. The default compaction point is 95 percent of 272K, about 258K, already past the decline. Usable means keeping at least 85 percent of the short-context score at the longest length.</desc>
<defs><pattern id="untested" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" fill="none" stroke="#d8dcd7" stroke-width="1"/></pattern></defs>
