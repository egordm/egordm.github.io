<rect x="214.464" y="252" width="181.536" height="24" rx="0" fill="url(#untested)"/>
<text x="24" y="297" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">0</text>
<text x="214.464" y="297" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">512K</text>
