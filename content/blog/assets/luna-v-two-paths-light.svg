<title id="title">Same fact. Different work.</title>
<desc id="desc">Invented example: Kai lives next to the Rijksmuseum. Who lives next to the Rijksmuseum shares words with the fact. Who has been to Amsterdam shares none: it needs a hop from Amsterdam to the Rijksmuseum before retrieving Kai.</desc>
