<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-labelledby="title desc">
<title id="title">filler</title>
<desc id="desc">Schematic trace spans. The full trace has an earlier span, a derivation and a later span. Cutting the derivation removes content and shortens the trace. Replacing it with filler removes that content but preserves the token count and the later span’s position.</desc>
<rect x="0" y="0" width="420" height="320" rx="0" fill="#ffffff"/>
<text x="18" y="26" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#252725">Full trace</text>
<rect x="18" y="38" width="100" height="34" rx="4" fill="#ffffff" stroke="#d8dcd7"/>
<text x="68.0" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#595e5b">Earlier</text>
<text x="18" y="125" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#252725">Cut</text>
<rect x="18" y="137" width="100" height="34" rx="4" fill="#ffffff" stroke="#d8dcd7"/>
<text x="68.0" y="159" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#595e5b">Earlier</text>
<text x="18" y="224" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#252725">Filler version</text>
<rect x="18" y="236" width="100" height="34" rx="4" fill="#ffffff" stroke="#d8dcd7"/>
<text x="68.0" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#595e5b">Earlier</text>
<rect x="126" y="38" width="166" height="34" rx="4" fill="#e9edfc" stroke="#4557ba"/>
<text x="209.0" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#4557ba">Derivation</text>
<rect x="300" y="38" width="100" height="34" rx="4" fill="#ffffff" stroke="#d8dcd7"/>
<text x="350.0" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#595e5b">Later</text>
<rect x="126" y="137" width="100" height="34" rx="4" fill="#ffffff" stroke="#d8dcd7"/>
<text x="176.0" y="159" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#595e5b">Later</text>
<text x="245" y="159" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#a8460c">shorter</text>
<text x="18" y="193" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#a8460c">Content removed · fewer steps</text>
<rect x="126" y="236" width="166" height="34" rx="4" fill="#faebdf" stroke="#a8460c"/>
<text x="209.0" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#a8460c">Filler</text>
<rect x="300" y="236" width="100" height="34" rx="4" fill="#ffffff" stroke="#d8dcd7"/>
<text x="350.0" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#595e5b">Later</text>
<text x="18" y="292" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#a8460c">Content removed · same token count</text>
<text x="210" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#595e5b">Schematic spans · widths are illustrative</text>
</svg>
