<text x="24" y="65" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Compact before the fall.</text>
<text x="24" y="91" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Meaning-based work · lengths in tokens</text>
