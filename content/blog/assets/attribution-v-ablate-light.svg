<svg xmlns="http://www.w3.org/2000/svg" width="420" height="540" viewBox="0 0 420 540" role="img" aria-labelledby="title desc">
<title id="title">Lock the answer.</title>
<desc id="desc">Two sources: a config file saying port 8080 and an lsof tool result saying the server listens on 3000. The recorded answer 3000 stays fixed. The model assigns it 90% with both sources, 95% with the config removed, and 2% with the lsof result removed. Invented numbers.</desc>
<defs><pattern id="untested" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" fill="none" stroke="#d8dcd7" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="420" height="540" rx="0" fill="#ffffff"/>
<text x="24" y="30" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">01 / THE EXPERIMENT</text>
<text x="24" y="65" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Lock the answer.</text>
<text x="24" y="91" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Then remove sources, one at a time. Invented numbers.</text>
<rect x="24" y="112" width="180" height="70" rx="12" fill="#faebdf"/>
<text x="38" y="136" fill="#a8460c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">CONFIG FILE</text>
<text x="38" y="162" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">port = 8080</text>
<rect x="216" y="112" width="180" height="70" rx="12" fill="#e4f3ee"/>
<text x="230" y="136" fill="#00796b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">LSOF TOOL RESULT</text>
<text x="230" y="162" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">listening on 3000</text>
<rect x="24" y="196" width="372" height="50" rx="12" fill="#ffffff" stroke="#d8dcd7"/>
<text x="40" y="227" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Recorded answer:</text>
<text x="170" y="227" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">&quot;3000&quot;  (locked)</text>
<text x="24" y="280" fill="#595e5b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start">PROBABILITY THE MODEL GIVES &quot;3000&quot;</text>
<text x="24" y="325" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Both sources</text>
<rect x="150" y="308" width="190" height="24" rx="6" fill="#eeeFEB"/>
<rect x="150" y="308" width="171.0" height="24" rx="6" fill="#4557ba"/>
<text x="350" y="326" fill="#4557ba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">90%</text>
<text x="24" y="381" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Config removed</text>
<rect x="150" y="364" width="190" height="24" rx="6" fill="#eeeFEB"/>
<rect x="150" y="364" width="180.5" height="24" rx="6" fill="#4557ba"/>
<text x="350" y="382" fill="#4557ba" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">95%</text>
<text x="24" y="437" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">lsof removed</text>
<rect x="150" y="420" width="190" height="24" rx="6" fill="#eeeFEB"/>
<rect x="150" y="420" width="6" height="24" rx="6" fill="#a8460c"/>
<text x="350" y="438" fill="#a8460c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">2%</text>
<text x="24" y="490" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Removing the lsof result makes the same</text>
<text x="24" y="512" fill="#252725" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">answer 45 times less likely.</text>
</svg>
